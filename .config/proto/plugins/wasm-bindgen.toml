format = "2"

[metadata]
name = "wasm-bindgen CLI"
type = "command-line"

[resolve]
git_url = "https://github.com/wasm-bindgen/wasm-bindgen"

[install]
download_url = "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/{version}/{download_name}"

[platform.macos]
download_name = "wasm-bindgen-{version}-{arch}-apple-darwin.tar.gz"
archive_prefix = "wasm-bindgen-{version}-{arch}-apple-darwin"
archs = ["arm64", "x64"]

[platform.macos.arch]
arm64 = "aarch64"
x64 = "x86_64"

[platform.linux]
download_name = "wasm-bindgen-{version}-{arch}-unknown-linux-musl.tar.gz"
archive_prefix = "wasm-bindgen-{version}-{arch}-unknown-linux-musl"
archs = ["arm64", "x64"]

[platform.linux.arch]
arm64 = "aarch64"
x64 = "x86_64"

[locate.exes.wasm-bindgen]
exe_path = "wasm-bindgen"
primary = true

[locate.exes.wasm-bindgen-test-runner]
exe_path = "wasm-bindgen-test-runner"
