format = "2"

[metadata]
name = "Dioxus CLI (dx)"
type = "command-line"

[resolve]
git_url = "https://github.com/DioxusLabs/dioxus"

[install]
download_url = "https://github.com/DioxusLabs/dioxus/releases/download/v{version}/{download_name}"
checksum_url = "https://github.com/DioxusLabs/dioxus/releases/download/v{version}/{checksum_name}"

[platform.macos]
download_name = "dx-{arch}-apple-darwin.tar.gz"
checksum_name = "dx-{arch}-apple-darwin.sha256"
archs = ["arm64", "x64"]

[platform.macos.arch]
arm64 = "aarch64"
x64 = "x86_64"

[platform.linux]
download_name = "dx-{arch}-unknown-linux-gnu.tar.gz"
checksum_name = "dx-{arch}-unknown-linux-gnu.sha256"
archs = ["arm64", "x64"]

[platform.linux.arch]
arm64 = "aarch64"
x64 = "x86_64"

[locate.exes.dx]
exe_path = "dx"
primary = true
