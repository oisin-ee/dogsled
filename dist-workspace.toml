[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Publish the Pi extension to npm after the binaries are built.
publish-jobs = ["./publish-npm"]
# Checkout needs contents; npm trusted publishing needs the OIDC token.
github-custom-job-permissions = { "publish-npm" = { contents = "read", id-token = "write" } }
# Dotfiles installs these templates; dist only bundles them beside the binary.
include = ["plugin/services/wrangle.service", "plugin/services/dev.wrangle.plist"]
