[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Publish only through an explicit dispatch after the release PR passes CI.
dispatch-releases = true
pr-run-mode = "skip"
# The installers to generate for each app. The shell installer writes an install
# receipt, which `dogsled update` reads to update the binary in place.
installers = ["shell"]
# A user-writable directory on PATH, so neither install nor update needs sudo.
install-path = "~/.local/bin"
# The GitHub release appears only after every publish job, so the latest release
# always has its binaries and npm packages. The npm packages carry no binaries.
github-release = "announce"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Where to host releases
hosting = "github"
# Build the web portal UI before the cargo-dist build.
github-build-setup = "../build-setup.yml"
# After the binaries are built, publish the Pi packages to npm and move the `release`
# branch to the new tag. Both finish before `announce` makes the release the latest one,
# so a host that sees the release finds every plugin channel already on it.
publish-jobs = ["./publish-npm", "./advance-release-branch"]
# Checkout needs contents; npm trusted publishing needs the OIDC token.
github-custom-job-permissions = { "publish-npm" = { contents = "read", id-token = "write" }, "advance-release-branch" = { contents = "write" } }
# Service templates for a host that runs `dogsled serve` and `dogsled web` at login.
include = ["plugin/services/dogsled.service", "plugin/services/dev.dogsled.plist", "plugin/services/dev.dogsled.web.plist"]

# GitHub retires the macos-14 image on 2026-11-02 and fails its jobs during brownouts.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
