# Local tasks. CI runs the same commands (see .github/workflows/ci.yml).
[tools]
node = "24"
lefthook = "latest"

[tasks.fmt]
description = "Format Rust and check nothing else drifts"
run = "cargo fmt"

[tasks.lint]
description = "Clippy with warnings as errors, every target"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Rust unit and integration tests"
run = "cargo test"

[tasks.typecheck]
description = "Strict TypeScript check of the Pi shim"
run = "npm run --silent typecheck"

[tasks."test:shim"]
description = "Pi shim tests (node --test over the .ts sources)"
run = "npm run --silent test"

[tasks."check:rust"]
description = "Rust verification: format, clippy, and tests"
run = [
  "cargo fmt --check",
  "cargo clippy --all-targets -- -D warnings",
  "cargo test",
]

[tasks."check:pi"]
description = "Pi shim verification: types and behavior tests"
run = [
  "npm run --silent typecheck",
  "npm run --silent test",
]

[tasks.check]
description = "Everything CI runs: Rust and Pi shim verification"
depends = ["check:rust", "check:pi"]
