# Herdr plugin manifest. Install: herdr plugin install oisin-ee/wrangle --ref vX.Y.Z --yes
# The plugin only calls the wrangle binary; install that with mise or cargo first (see README).

id = "wrangle"
name = "wrangle"
version = "0.7.1"
min_herdr_version = "0.9.1"
description = "Opens the wrangle host status board."
platforms = ["macos", "linux"]

# Every host, its agents, and its reservations. Refreshes until Ctrl-C.
[[panes]]
id = "board"
title = "wrangle"
placement = "popup"
width = "90%"
height = "70%"
command = ["sh", "plugin/board.sh"]
