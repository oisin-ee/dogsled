# Herdr plugin manifest. Install: herdr plugin install oisin-ee/dogsled --ref vX.Y.Z --yes
# The plugin only calls the dogsled binary; install that with mise or cargo first (see README).

id = "dogsled"
name = "dogsled"
version = "0.17.0"
min_herdr_version = "0.9.1"
description = "Opens the dogsled host status board."
platforms = ["macos", "linux"]

# Every host, its agents, and its reservations. Refreshes until Ctrl-C.
[[panes]]
id = "board"
title = "dogsled"
placement = "popup"
width = "90%"
height = "70%"
command = ["sh", "plugin/board.sh"]
