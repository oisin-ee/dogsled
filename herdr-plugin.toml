# Herdr plugin manifest. Install: herdr plugin install oisin-ee/dogsled --ref vX.Y.Z --yes

id = "dogsled"
name = "dogsled"
version = "0.27.0"
min_herdr_version = "0.9.1"
description = "Docks the dogsled sidebar beside Herdr's left sidebar."
platforms = ["macos", "linux"]

# Installs the checksum-verified release binary for this version at bin/dogsled,
# or builds it with cargo when no release archive exists. `plugin link` skips it.
[[build]]
command = ["sh", "plugin/fetch.sh"]

# Closes this tab's docked board, or opens it. The owner comes from
# `board --toggle` takes the owner from HERDR_PLUGIN_CONTEXT_JSON / HERDR_PANE_ID.
[[actions]]
id = "toggle"
title = "Toggle dogsled board"
contexts = ["pane"]
command = ["bin/dogsled", "board", "--toggle"]

# The sidebar app: Hosts, Agents & Jobs, and Todos in three framed panels. `board --open`
# splits it right of the tab's leftmost pane, swaps it into that slot, and sizes it to 38 cells.
[[panes]]
id = "sidebar"
title = "dogsled"
placement = "split"
command = ["bin/dogsled", "sidebar"]
