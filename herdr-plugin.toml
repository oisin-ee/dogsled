# Herdr plugin manifest. Install: herdr plugin install oisin-ee/dogsled --ref vX.Y.Z --yes

id = "dogsled"
name = "dogsled"
version = "0.20.0"
min_herdr_version = "0.9.1"
description = "Opens the dogsled right-side work board."
platforms = ["macos", "linux"]

# Installs the checksum-verified release binary for this version at bin/dogsled,
# or builds it with cargo when no release archive exists. `plugin link` skips it.
[[build]]
command = ["sh", "plugin/fetch.sh"]

# Cached quotas, owned work, and provider-rendered todos. Herdr splits right by default.
[[panes]]
id = "board"
title = "dogsled"
placement = "split"
command = ["bin/dogsled", "board", "--side", "--watch"]
