name: Release please

# Every push to main settles the release main still owes, not only the push that merged
# it. The gate validates the commit this run is for, so a release is tagged only by a run
# for its own release commit: its push, or a dispatch retry before main moves on. A
# release that main has moved past is abandoned by reverting its release commit; the next
# run then marks its PR superseded and release-please opens a fresh release PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Keep release-PR updates behind publication and its lifecycle-label change.
concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      release-pr: ${{ steps.release.outputs.release-pr }}
      tag: ${{ steps.release.outputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The script reads the manifest at each release PR's merge commit.
          fetch-depth: 0
      - name: Settle merged release PRs and find the outstanding release
        id: release
        run: sh scripts/release-prepare.sh >> "$GITHUB_OUTPUT"

  release-please:
    needs: prepare
    if: needs.prepare.outputs.release-pr == ''
    runs-on: ubuntu-24.04
    # The permissions that release-please-action documents for GITHUB_TOKEN.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # GITHUB_TOKEN release PRs intentionally start no pull_request workflows.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  # Validate the commit this run is for, which prepare proved is the release commit.
  ci:
    needs: prepare
    if: needs.prepare.outputs.release-pr != ''
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [prepare, ci]
    if: needs.prepare.outputs.release-pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_PR: ${{ needs.prepare.outputs.release-pr }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag the validated release commit and dispatch dist
        run: |
          test -z "$(git ls-remote --tags origin "refs/tags/$TAG")"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f "tag=$TAG"
      - name: Complete the release-please lifecycle
        run: |
          gh label create "autorelease: tagged" --repo "$GITHUB_REPOSITORY" --force
          gh pr edit "$RELEASE_PR" --repo "$GITHUB_REPOSITORY" \
            --remove-label "autorelease: pending" --add-label "autorelease: tagged"
