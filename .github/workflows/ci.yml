name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      # The release gate validates the release commit, which a retry runs after main
      # has moved on. Empty means the triggering commit.
      ref:
        type: string
        default: ""

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      # rustup owns the Rust toolchain. rust-toolchain.toml pins the channel,
      # the wasm target and the components, so install it here. Proto must
      # not install it: its own rust install applies the toolchain file's
      # component list, which leaves the toolchain without cargo and rustc.
      - run: rustup toolchain install
      # .prototools pins moon, node, dx, pnpm, wasm-bindgen, and shfmt.
      - run: proto install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: moon run dogsled:fmt-check todo-core:fmt todo-wasm:fmt prewalk-core:fmt prewalk-wasm:fmt
      - name: Web lint
        run: moon run :web-lint
      - name: Web build
        run: moon run :web-build
      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: web/public
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  rust:
    needs: checks
    name: rust (${{ matrix.os }}${{ matrix.shard && format(' {0}/2', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # The 3-core macOS runner cannot run the whole suite inside the timeout,
        # so two macOS jobs each run half of it (scripts/test-shard.sh). Lint
        # runs once per OS.
        include:
          - os: ubuntu-24.04
            tests: dogsled:test
            lint: true
          - os: macos-15
            shard: 1
            tests: dogsled:test-shard-1
            lint: true
          - os: macos-15
            shard: 2
            tests: dogsled:test-shard-2
            lint: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: web/public
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - run: rustup toolchain install
      - run: proto install
      - uses: Swatinem/rust-cache@v2
      # The checks job already satisfied the web-build dependency. Keep the
      # local Moon dependencies, but do not rebuild the downloaded bundle.
      - name: Lint
        if: matrix.lint
        run: moon run dogsled:lint :clippy --upstream none
      # Stream test output. A buffered task loses its output when the job
      # timeout cancels it, so a hung test would leave no name in the log.
      - name: Test
        run: moon run ${{ matrix.tests }} todo-core:test todo-wasm:test prewalk-core:test prewalk-wasm:test --upstream none --output-style stream

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - run: rustup toolchain install
      - run: proto install
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: moon run dogsled:install
      - name: Typecheck
        run: moon run dogsled:typecheck
      - name: Format moved files
        run: moon run dogsled:format
      - name: Lint moved extensions
        run: moon run pi-todo:lint pi-prewalk:lint pi-tiers:lint pi-guardrails:lint
      - name: Test moved extensions
        run: moon run pi-todo:test pi-prewalk:test pi-tiers:test pi-guardrails:test
      - name: Shim tests
        run: moon run dogsled:test-shim
