name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      # .prototools pins every tool of this job: moon, node, rust and dx.
      # The rust entry is what lets proto's cargo backend install dx.
      - run: proto install
      # rust-toolchain.toml pins the channel, components and the wasm target.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Web lint
        run: moon run :web-lint
      - name: Web build
        run: moon run :web-build
      - name: Format
        run: moon run :fmt-check
      - name: Lint
        run: moon run :lint
      - name: Test
        run: moon run :test

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - run: proto install moon
      - run: proto install node
      - name: Install dependencies
        run: moon run :install
      - name: Typecheck
        run: moon run :typecheck
      - name: Shim tests
        run: moon run :test-shim
