name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      # rustup owns the Rust toolchain. rust-toolchain.toml pins the channel,
      # the wasm target and the components, so install it here. Proto must
      # not install it: its own rust install applies the toolchain file's
      # component list, which leaves the toolchain without cargo and rustc.
      - run: rustup toolchain install
      # dx bundles the web portal UI. Proto's cargo backend would build it
      # from source, which takes over ten minutes on macOS. binstall fetches
      # the published binary instead, in seconds.
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - name: Cache dx
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/dx
          key: dx-${{ runner.os }}-${{ runner.arch }}-0.7.10
      - name: Install dx
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: cargo binstall --no-confirm --locked dioxus-cli@0.7.10
      # .prototools pins the other tools of this job: moon and node.
      - run: proto install
      - uses: Swatinem/rust-cache@v2
      - name: Web lint
        run: moon run :web-lint
      - name: Web build
        run: moon run :web-build
      - name: Format
        run: moon run :fmt-check
      - name: Lint
        run: moon run :lint
      - name: Test
        run: moon run :test

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - run: proto install moon
      - run: proto install node
      - name: Install dependencies
        run: moon run :install
      - name: Typecheck
        run: moon run :typecheck
      - name: Shim tests
        run: moon run :test-shim
