name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      # rustup owns the Rust toolchain. rust-toolchain.toml pins the channel,
      # the wasm target and the components, so install it here. Proto must
      # not install it: its own rust install applies the toolchain file's
      # component list, which leaves the toolchain without cargo and rustc.
      - run: rustup toolchain install
      # .prototools pins moon, node, dx, pnpm, wasm-bindgen, and shfmt.
      - run: proto install
      - uses: Swatinem/rust-cache@v2
      - name: Web lint
        run: moon run :web-lint
      - name: Web build
        run: moon run :web-build
      - name: Format
        run: moon run dogsled:fmt-check todo-core:fmt todo-wasm:fmt prewalk-core:fmt prewalk-wasm:fmt
      - name: Lint
        run: moon run dogsled:lint :clippy
      - name: Test
        run: moon run dogsled:test todo-core:test todo-wasm:test prewalk-core:test prewalk-wasm:test

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Moon diffs against main, so it needs the full history.
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - run: rustup toolchain install
      - run: proto install
      - id: store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: moon run dogsled:install
      - name: Typecheck
        run: moon run dogsled:typecheck
      - name: Format moved files
        run: moon run dogsled:format
      - name: Lint moved extensions
        run: moon run pi-todo:lint pi-prewalk:lint pi-tiers:lint pi-guardrails:lint
      - name: Test moved extensions
        run: moon run pi-todo:test pi-prewalk:test pi-tiers:test pi-guardrails:test
      - name: Shim tests
        run: moon run dogsled:test-shim
