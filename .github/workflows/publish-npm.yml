# release.yml calls this workflow after the binaries are built.
# Each package's trusted publisher must name dogsled and release.yml.
name: Publish npm

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26.7.0
          registry-url: https://registry.npmjs.org
      - name: Check every package version against the tag
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          tag=$(jq -r '.announcement_tag' <<<"$PLAN")
          for directory in . packages/pi-todo packages/pi-prewalk packages/pi-tiers packages/pi-guardrails packages/oisinpi; do
            version=$(node -p 'require(process.argv[1]).version' "$PWD/$directory/package.json")
            test "$tag" = "v$version" || { echo "tag $tag does not match $directory/package.json $version"; exit 1; }
          done
      # Re-runs skip each version already on npm, including a manual first publish.
      - name: Select unpublished versions
        id: pending
        run: |
          : > "$RUNNER_TEMP/npm-pending"
          for directory in . packages/pi-todo packages/pi-prewalk packages/pi-tiers packages/pi-guardrails packages/oisinpi; do
            name=$(node -p 'require(process.argv[1]).name' "$PWD/$directory/package.json")
            version=$(node -p 'require(process.argv[1]).version' "$PWD/$directory/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              echo "$directory" >> "$RUNNER_TEMP/npm-pending"
            fi
          done
          if test -s "$RUNNER_TEMP/npm-pending"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pending.outputs.publish == 'true'
        run: rustup toolchain install
      - if: steps.pending.outputs.publish == 'true'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      - if: steps.pending.outputs.publish == 'true'
        run: proto install
      - if: steps.pending.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build published bindings and hook runtime
        if: steps.pending.outputs.publish == 'true'
        run: moon run pi-todo:generate pi-prewalk:generate pi-guardrails:build
      - if: steps.pending.outputs.publish == 'true'
        run: pnpm run typecheck
      - if: steps.pending.outputs.publish == 'true'
        env:
          PI_TODO_SOURCE: ${{ github.workspace }}/packages/pi-todo/src
        run: pnpm test
      - name: Publish unpublished versions with provenance
        if: steps.pending.outputs.publish == 'true'
        run: |
          while IFS= read -r directory; do
            pnpm --dir "$directory" publish --access public --provenance
          done < "$RUNNER_TEMP/npm-pending"
