- name: Install the wasm target
  run: rustup target add wasm32-unknown-unknown
- name: Install cargo-binstall
  uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
- name: Install dx
  run: cargo binstall --no-confirm --locked dioxus-cli@0.7.10
- name: Bundle the web portal UI
  run: dx bundle --web --release
  working-directory: web
