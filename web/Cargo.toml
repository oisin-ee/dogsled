[package]
name = "web"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "The dogsled web portal UI, built to WASM by `dx bundle --web`"
license = "MIT"
publish = false

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
dioxus-sdk-time = "0.7.0"
futures-util = { version = "0.3", default-features = false }
gloo-net = { version = "0.6", default-features = false, features = ["http", "eventsource", "json"] }
portal-types = { path = "../portal-types" }
pulldown-cmark = { version = "0.13.5", default-features = false, features = ["html"] }
web-sys = { version = "0.3", features = ["ClipboardEvent", "DataTransfer", "Element", "File", "FileList", "Location", "Range", "Selection", "UrlSearchParams", "Window"] }
serde = "1.0.229"
js-sys = "0.3"
serde_json = "1.0.151"
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
