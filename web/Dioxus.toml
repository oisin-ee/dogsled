[application]
# `dx bundle --web` writes index.html, assets/ and wasm/ into the `public`
# folder beside this file. A fixed folder lets the server embed the bundle
# later. dx copies the web bundle into the out_dir under its own name, so the
# out_dir is the folder that holds `public`.
out_dir = "."
# The web bundle itself is the only output. A public_dir would copy the
# previous bundle back into the next one.
public_dir = ""

[web.app]
title = "Dogsled"

# `dx serve` forwards the API to a running `dogsled web`.
[[web.proxy]]
backend = "http://127.0.0.1:7465/api/"
