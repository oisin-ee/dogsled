$schema: https://moonrepo.dev/schemas/workspace.json
versionConstraint: "=2.6.1"
# The root binary and Pi extension share a workspace with the moved projects.
defaultProject: dogsled
projects:
  dogsled: "."
  todo-core: crates/todo-core
  todo-wasm: crates/todo-wasm
  pi-todo: pi/todo
  prewalk-core: crates/prewalk-core
  prewalk-wasm: crates/prewalk-wasm
  pi-prewalk: packages/pi-prewalk
  pi-tiers: packages/pi-tiers
  pi-guardrails: packages/pi-guardrails
vcs:
  defaultBranch: main
  # Moon writes the Git hook scripts and links them on every run.
  sync: true
  hooks:
    pre-commit:
      - env -u GIT_DIR proto run moon -- run :#precommit --affected --status staged
pipeline:
  syncProjects: false
  logRunningCommand: true
telemetry: false
