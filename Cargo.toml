[workspace]
members = [".", "portal-types", "web"]

[package]
name = "dogsled"
version = "0.26.0"
edition = "2024"
rust-version = "1.99"
description = "Host status and placement for coding agents across Herdr hosts"
license = "MIT"
repository = "https://github.com/oisin-ee/dogsled"
readme = "README.md"
keywords = ["herdr", "agents", "orchestration", "pi"]
categories = ["command-line-utilities", "development-tools"]
publish = false

# `publish = false` keeps the crate off crates.io; this tells cargo-dist to
# still build and release the binary.
[package.metadata.dist]
dist = true

[[bin]]
name = "dogsled"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3.4"
nix = { version = "0.31.3", features = ["signal", "process", "hostname", "user"] }
portal-types = { path = "portal-types" }
rust-embed = "8.13.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
rmcp = { version = "3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
similar = "3.2.1"
signal-hook = "0.4.5"
thiserror = "2.0.21"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7.20", default-features = false, features = ["rt"] }
toml = "1.1.6"

[dev-dependencies]
tower = { version = "0.5.2", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# JSON results are named after their outcome (`admitted: true`, `queued: true`);
# the field names are the public API.
struct_field_names = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The profile that `cargo dist` builds with. Small, stripped, and fast enough for
# a CLI that runs once per spawn.
[profile.dist]
inherits = "release"
lto = "thin"
strip = true
codegen-units = 1
