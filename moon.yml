$schema: https://moonrepo.dev/schemas/project.json
tasks:
  fmt:
    command: cargo fmt
    description: Format the Rust sources.
  fmt-check:
    command: cargo fmt --check
    description: Check the Rust formatting.
    tags: [precommit]
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
  lint:
    command: cargo clippy --all-targets -- -D warnings
    description: Run Clippy with warnings as errors, on every target.
    tags: [precommit]
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - "clippy.toml"
  test:
    command: cargo test
    description: Run the Rust unit and integration tests.
    tags: [precommit]
    inputs:
      - "src/**/*"
      - "tests/**/*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  typecheck:
    command: npm run --silent typecheck
    description: Typecheck the Pi extension.
    toolchain: node
    tags: [precommit]
    inputs:
      - "pi/**/*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  test-shim:
    command: npm run --silent test
    description: Run the Pi extension tests.
    toolchain: node
    tags: [precommit]
    inputs:
      - "pi/**/*"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
  install:
    command: npm ci --no-audit --no-fund
    description: Install the Pi extension dependencies.
    toolchain: node
    inputs:
      - "package.json"
      - "package-lock.json"
  check:
    description: Run every check that CI runs.
    deps:
      - fmt-check
      - lint
      - test
      - typecheck
      - test-shim
