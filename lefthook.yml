# Git hooks for this repo, managed by lefthook (https://lefthook.dev).
# Run `lefthook install` once after cloning to wire these into .git/hooks.

pre-commit:
  commands:
    rust:
      glob: ["*.rs", "**/*.rs", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml", "mise.toml", "lefthook.yml", ".cargo/*", "tests/**"]
      run: mise run check:rust
    pi:
      glob: ["pi/**", "package.json", "package-lock.json", "tsconfig.json", "mise.toml", "lefthook.yml"]
      run: mise run check:pi
