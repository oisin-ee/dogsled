# CI installs this toolchain with `rustup toolchain install`. Homebrew and Nix
# cargo ignore the file; keep their rust at or above `rust-version` in Cargo.toml.
# The channel matches the rust entry in .prototools.
[toolchain]
channel = "1.99.1"
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
components = ["clippy", "rustfmt"]
